# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-yusuf"
BBFILE_PATTERN_meta-yusuf = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-yusuf = "6"

LAYERDEPENDS_meta-yusuf = "core"
LAYERSERIES_COMPAT_meta-yusuf = "scarthgap"
